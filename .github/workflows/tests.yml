name: Python tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Verify repository source imports
        run: |
          python -m compileall -q market_structure_lab
          python -c "import market_structure_lab.fetch_alpaca_minutes,market_structure_lab.market_intelligence,market_structure_lab.sip_archive,market_structure_lab.experiment_lab"
      - name: Test
        run: python -m unittest discover -s tests_market_structure -v
      - name: Generate synthetic demo
        run: python -m market_structure_lab.demo --output-dir data_demo
      - name: Generate synthetic intraday and executed-print demo
        run: |
          python -m market_structure_lab.intraday_demo --data-dir data_demo --days 2
          python -m market_structure_lab.volume_profile_demo --data-dir data_demo
          python -c "from market_structure_lab.volume_profile import load_trades,build_profile; t=load_trades('data_demo/trades/SPY_trades.csv'); p=build_profile(t[t.session==t.session.iloc[-1]]); assert p['volume_shares'] > 0"

      - name: Synthetic strategy research smoke test
        run: python -m market_structure_lab.experiment_lab --data-dir data_demo --out outputs/v07_ci_smoke --cost-bps 5
